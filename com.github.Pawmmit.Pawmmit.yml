app-id: com.github.Pawmmit.Pawmmit
runtime: org.kde.Platform
runtime-version: 6.11
sdk: org.kde.Sdk
command: pawmmit
desktop-file-name-suffix: "" # used to create development version
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=network
  - --share=ipc
  - --filesystem=home
  - --filesystem=/tmp # Needed to store temporary files, which should be opened by external (non sandboxed) applications like kdiff3. Did not find another way to share a temporary file to the host (only creating a tmp folder in the home folder, I don't like)
  # we use the keyring to store credentials
  - --filesystem=xdg-run/keyring
  # for git repos that require ssh keys
  - --socket=ssh-auth
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.Flatpak
rename-icon: pawmmit # Image will renamed to match the app-id konvention

build-options:
  append-path: /usr/lib/sdk/golang/bin

modules:
  - name: git-lfs
    buildsystem: simple
    build-commands:
      - PREFIX=${FLATPAK_DEST} ./install.sh
    sources:
      - type: archive
        strip-components: 1
        url: https://github.com/git-lfs/git-lfs/releases/download/v3.7.1/git-lfs-linux-amd64-v3.7.1.tar.gz
        sha256: 1c0b6ee5200ca708c5cebebb18fdeb0e1c98f1af5c1a9cba205a4c0ab5a5ec08
        only-arches: [x86_64]
        x-checker-data:
          type: json
          url: https://api.github.com/repos/git-lfs/git-lfs/releases/latest
          url-query: .assets[] | select(.name=="git-lfs-linux-amd64-" + $version +
            ".tar.gz") | .browser_download_url
          version-query: .tag_name
      - type: archive
        strip-components: 1
        url: https://github.com/git-lfs/git-lfs/releases/download/v3.7.1/git-lfs-linux-arm64-v3.7.1.tar.gz
        sha256: 73a9c90eeb4312133a63c3eaee0c38c019ea7bfa0953d174809d25b18588dd8d
        only-arches: [aarch64]
        x-checker-data:
          type: json
          url: https://api.github.com/repos/git-lfs/git-lfs/releases/latest
          url-query: .assets[] | select(.name=="git-lfs-linux-arm64-" + $version +
            ".tar.gz") | .browser_download_url
          version-query: .tag_name

  - name: git
    buildsystem: simple
    build-commands:
      - install -Dm755 $(which git) ${FLATPAK_DEST}/bin/
      - install -Dm755 $(which git-cvsserver) ${FLATPAK_DEST}/bin/
      - install -Dm755 $(which git-receive-pack) ${FLATPAK_DEST}/bin/
      - install -Dm755 $(which git-shell) ${FLATPAK_DEST}/bin/
      - install -Dm755 $(which git-upload-archive) ${FLATPAK_DEST}/bin/
      - install -Dm755 $(which git-upload-pack) ${FLATPAK_DEST}/bin/

  - name: libssh2
    rm-configure: true
    sources:
      - type: archive
        url: https://www.libssh2.org/download/libssh2-1.11.1.tar.gz
        sha256: d9ec76cbe34db98eec3539fe2c899d26b0c837cb3eb466a56b0f109cabf658f7
        x-checker-data:
          type: anitya
          project-id: 1730
          url-template: https://www.libssh2.org/download/libssh2-$version.tar.gz
      - type: script
        commands:
          - autoreconf -fiv
        dest-filename: autogen.sh

  # libgit2 is built directly with CMake here, like libssh2 above (see
  # meson.build). lua/hunspell/cmark come from Meson wraps instead, seeded
  # into packagecache below since this sandbox has no network mid-build.
  - name: libgit2
    buildsystem: cmake-ninja
    builddir: true
    config-opts: [-DCMAKE_BUILD_TYPE=Release, -DBUILD_TESTS=OFF, -DBUILD_CLI=OFF, -DBUILD_EXAMPLES=OFF, -DUSE_SSH=ON]
    sources:
      - type: archive
        url: https://github.com/libgit2/libgit2/archive/refs/tags/v1.9.1.tar.gz
        sha256: 14cab3014b2b7ad75970ff4548e83615f74d719afe00aa479b4a889c1e13fc00

  - name: Pawmmit
    buildsystem: meson
    config-opts: ["--buildtype=release", "-Dflatpak=true", "-Denable_update_over_gui=false", "-Dtests=false"]
    builddir: true
    sources:
      - type: git
        url: https://github.com/Pawmmit/Pawmmit.git
        branch: main
      # Pre-seeds subprojects/packagecache/ since this sandbox has no network
      # mid-build; keep hashes in sync with subprojects/*.wrap.
      - type: file
        url: https://downloads.sourceforge.net/project/scintilla/scintilla/5.6.6/scintilla566.tgz
        sha256: b6b08598c68fac90990d010c1142494d707530602b5320753274d045c2b02189
        dest: subprojects/packagecache
        dest-filename: scintilla566.tgz
      - type: file
        url: https://github.com/ScintillaOrg/lexilla/archive/refs/tags/rel-5-5-3.tar.gz
        sha256: b3bce10c60918da5c87a9849b12fbcac0a5f0a6e4cb2c0b6684f320f00899c47
        dest: subprojects/packagecache
        dest-filename: lexilla-rel-5-5-3.tar.gz
      - type: file
        url: https://github.com/orbitalquark/scintillua/archive/refs/tags/scintillua_6.7.tar.gz
        sha256: 47fe74d86d8616779c9efc659f737de4b8bfe6dfc022692a7fdeaf7995710ae5
        dest: subprojects/packagecache
        dest-filename: scintillua-scintillua_6.7.tar.gz
      - type: file
        url: http://www.inf.puc-rio.br/~roberto/lpeg/lpeg-1.1.0.tar.gz
        sha256: 4b155d67d2246c1ffa7ad7bc466c1ea899bbc40fef0257cc9c03cecbaed4352a
        dest: subprojects/packagecache
        dest-filename: lpeg-1.1.0.tar.gz
      - type: file
        url: https://www.lua.org/ftp/lua-5.4.8.tar.gz
        sha256: 4f18ddae154e793e46eeab727c59ef1c0c0c2b744e7b94219710d76f530629ae
        dest: subprojects/packagecache
        dest-filename: lua-5.4.8.tar.gz
      - type: file
        url: https://wrapdb.mesonbuild.com/v2/lua_5.4.8-1/get_patch
        sha256: e9d7e451cd7b5e1204c0ba43d7b55e3f195a67b348917c35963f18d7e1dacfbe
        dest: subprojects/packagecache
        dest-filename: lua_5.4.8-1_patch.zip
      - type: file
        url: https://github.com/commonmark/cmark/archive/refs/tags/0.31.1.tar.gz
        sha256: 3da93db5469c30588cfeb283d9d62edfc6ded9eb0edc10a4f5bbfb7d722ea802
        dest: subprojects/packagecache
        dest-filename: cmark-0.31.1.tar.gz
      - type: file
        url: https://github.com/hunspell/hunspell/archive/refs/tags/v1.7.2.tar.gz
        sha256: 69fa312d3586c988789266eaf7ffc9861d9f6396c31fc930a014d551b59bbd6e
        dest: subprojects/packagecache
        dest-filename: hunspell-1.7.2.tar.gz
