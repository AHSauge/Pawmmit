<svg viewBox="0 0 660 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F2FF"/>
      <stop offset="100%" stop-color="#EDE7FF"/>
    </linearGradient>
    <linearGradient id="pawGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C5CFC"/>
      <stop offset="100%" stop-color="#5B3FE0"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="660" height="400" fill="url(#bgGrad)"/>

  <!-- faint watermark paw prints, decorative, top-left and bottom-right corners -->
  <g opacity="0.06" fill="#5B3FE0">
    <g transform="translate(40,40) scale(0.22)">
      <ellipse cx="100" cy="140" rx="42" ry="33"/>
      <circle cx="52" cy="98" r="19"/>
      <circle cx="83" cy="72" r="20"/>
      <circle cx="117" cy="72" r="20"/>
      <circle cx="148" cy="98" r="19"/>
    </g>
    <g transform="translate(560,320) scale(0.22)">
      <ellipse cx="100" cy="140" rx="42" ry="33"/>
      <circle cx="52" cy="98" r="19"/>
      <circle cx="83" cy="72" r="20"/>
      <circle cx="117" cy="72" r="20"/>
      <circle cx="148" cy="98" r="19"/>
    </g>
  </g>

  <!-- small logo lockup, top center (Finder title bar sits above y=0, so keep clear of very top) -->
  <g transform="translate(266,26)">
    <g transform="scale(0.15)" fill="url(#pawGrad)">
      <ellipse cx="100" cy="140" rx="42" ry="33"/>
      <circle cx="52" cy="98" r="19"/>
      <circle cx="83" cy="72" r="20"/>
      <circle cx="148" cy="98" r="19"/>
    </g>
    <circle cx="17.5" cy="10.8" r="3" fill="#FF6FA0" transform="translate(0,0)"/>
    <text x="34" y="21" font-family="Fredoka" font-weight="500" font-size="20" fill="#241C4D">Pawmmit</text>
  </g>

  <!-- claw-swipe mark, curving from app icon position toward Applications -->
  <g fill="none" stroke="#B9A6E0" stroke-width="4" stroke-linecap="round">
    <path d="M 245 185 C 300 165, 360 165, 405 188"/>
    <path d="M 245 202 C 300 182, 360 182, 405 205"/>
    <path d="M 245 219 C 300 199, 355 199, 400 222"/>
  </g>
  <path d="M 393 176 L 412 197 L 390 213" fill="none" stroke="#B9A6E0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- instructional label -->
  <text x="330" y="270" font-family="JetBrains Mono" font-weight="400" font-size="14" fill="#7A72A6" text-anchor="middle">Drag Pawmmit into Applications to install</text>

  <!-- position guides for icons (visual only, actual icons placed by dmg tool) -->
  <!-- App icon slot: centered ~ (180,190); Applications slot: centered ~ (480,190) -->
</svg>
